[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-marathon-plan-generator"
version = "0.1.0"
description = "Runna-inspired 10K, half marathon, and marathon plan generator with Google Sheets-ready output."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
